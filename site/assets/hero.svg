<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Du scan au rapport PDF</title>
  <desc id="hero-desc">Une URL passe par l'audit local, puis le rapport HTML et le PDF en français sortent de la même analyse.</desc>
  <rect width="640" height="400" rx="16" fill="#f5f5f4"/>
  <rect x="40" y="150" width="150" height="100" rx="8" fill="#ffffff" stroke="#767676" stroke-width="2"/>
  <text x="115" y="206" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="#1c1917">URL</text>
  <path d="M200 200h60" stroke="#1e3a5f" stroke-width="4"/>
  <path d="M252 190l12 10-12 10" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round"/>
  <rect x="272" y="150" width="160" height="100" rx="8" fill="#1e3a5f"/>
  <text x="352" y="196" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Audit</text>
  <text x="352" y="222" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#ffffff">axe-core local</text>
  <path d="M442 200h60" stroke="#1e3a5f" stroke-width="4"/>
  <path d="M494 190l12 10-12 10" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round"/>
  <rect x="514" y="150" width="90" height="100" rx="8" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <text x="559" y="196" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" fill="#1e3a5f">PDF</text>
  <text x="559" y="222" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#57534e">A4</text>
  <rect x="40" y="300" width="560" height="10" rx="5" fill="#ffffff" stroke="#767676" stroke-width="1"/>
  <rect x="40" y="300" width="330" height="10" rx="5" fill="#b45309"/>
</svg>
